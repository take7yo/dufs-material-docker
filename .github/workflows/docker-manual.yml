# ──────────────────────────────────────────────────────────────────────────────
#  docker-manual.yml – Manual build & publish with -fix tag suffix
#
#  Registries:
#    • Docker Hub   – docker.io/take7yo/dufs
#    • 阿里云 ACR    – registry.cn-hangzhou.aliyuncs.com/take7yo/dufs
#
#  Trigger: workflow_dispatch only (manual)
#
#  Builds dufs from source (sigoden/dufs) with Material Assets UI.
#  Supports 5 Linux platforms: amd64, arm64, armv7, armv6, i386
#  Docker tag has -fix suffix (e.g. v0.46.0-fix)
# ──────────────────────────────────────────────────────────────────────────────
name: Manual Build & Publish (-fix)

on:
  workflow_dispatch:
    inputs:
      version:
        description: "dufs version (e.g. 0.46.0)"
        required: true
        type: string
      assets_version:
        description: "Assets version (leave empty to use dufs version)"
        required: false
        type: string

permissions:
  contents: read

env:
  DOCKERHUB_REPO: take7yo/dufs
  ACR_REGISTRY: registry.cn-hangzhou.aliyuncs.com
  ACR_REPO: registry.cn-hangzhou.aliyuncs.com/take7yo/dufs

# ──────────────────────────────────────────────────────────────────────────────
jobs:
  # ════════════════════════════════════════════════════════════════════════════
  #  Job 1: Validate inputs
  # ════════════════════════════════════════════════════════════════════════════
  validate:
    runs-on: ubuntu-latest
    outputs:
      version:         ${{ steps.resolve.outputs.version }}
      assets_version:  ${{ steps.resolve.outputs.assets_version }}
    steps:
      - name: Resolve inputs
        id: resolve
        run: |
          VERSION="${{ github.event.inputs.version }}"
          ASSETS_VERSION="${{ github.event.inputs.assets_version }}"

          # Strip leading 'v' if user accidentally included it
          VERSION="${VERSION#v}"
          ASSETS_VERSION="${ASSETS_VERSION#v}"

          # Default assets version to dufs version
          if [ -z "$ASSETS_VERSION" ]; then
            ASSETS_VERSION="$VERSION"
          fi

          echo "Version       : ${VERSION}"
          echo "Assets version: ${ASSETS_VERSION}"

          echo "version=${VERSION}"              >> "$GITHUB_OUTPUT"
          echo "assets_version=${ASSETS_VERSION}" >> "$GITHUB_OUTPUT"

      - name: Verify source tag exists
        run: |
          VERSION="${{ steps.resolve.outputs.version }}"
          URL="https://github.com/sigoden/dufs/releases/tag/v${VERSION}"
          echo "Checking: ${URL}"
          HTTP_CODE=$(curl -sLo /dev/null -w "%{http_code}" "$URL")
          if [ "$HTTP_CODE" != "200" ]; then
            echo "::error::Source tag not found at ${URL} (HTTP ${HTTP_CODE})"
            exit 1
          fi
          echo "✅ Source tag v${VERSION} exists"

      - name: Verify assets release exists
        run: |
          ASSETS_VERSION="${{ steps.resolve.outputs.assets_version }}"
          URL="https://github.com/TransparentLC/dufs-material-assets/releases/download/v${ASSETS_VERSION}/dufs-material-assets-embed.zip"
          echo "Checking: ${URL}"
          HTTP_CODE=$(curl -sLo /dev/null -w "%{http_code}" "$URL")
          if [ "$HTTP_CODE" != "200" ]; then
            echo "::error::Assets not found at ${URL} (HTTP ${HTTP_CODE})"
            exit 1
          fi
          echo "✅ Assets release v${ASSETS_VERSION} exists"

  # ════════════════════════════════════════════════════════════════════════════
  #  Job 2: Build & verify per platform
  # ════════════════════════════════════════════════════════════════════════════
  build:
    runs-on: ubuntu-latest
    needs: validate
    strategy:
      fail-fast: true
      matrix:
        include:
          - platform: linux/amd64
            tag: amd64
          - platform: linux/arm64
            tag: arm64
          - platform: linux/arm/v7
            tag: armv7
          - platform: linux/arm/v6
            tag: armv6
          - platform: linux/386
            tag: i386
    steps:
      - uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # ── Build test image for this platform ─────────────────────────────────
      - name: "[${{ matrix.platform }}] Build test image"
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile.src
          target: test
          load: true
          tags: dufs-manual-test:${{ matrix.tag }}
          platforms: ${{ matrix.platform }}
          build-args: |
            DUFS_VERSION=${{ needs.validate.outputs.version }}
            DUFS_ASSETS_VERSION=${{ needs.validate.outputs.assets_version }}
          cache-from: type=gha,scope=src-manual-${{ matrix.platform }}
          cache-to: type=gha,scope=src-manual-${{ matrix.platform }},mode=max

      # ── Verify ─────────────────────────────────────────────────────────────
      - name: "[${{ matrix.platform }}] Verify image"
        run: |
          IMAGE="dufs-manual-test:${{ matrix.tag }}"
          PLAT="${{ matrix.platform }}"
          UA="Mozilla/5.0 (X11; Linux x86_64) AppleWebKit/537.36 Chrome/120.0.0.0"

          echo "── 1. Binary info ──"
          docker run --rm --platform "$PLAT" --entrypoint sh "$IMAGE" \
            -c "ls -lh /usr/local/bin/dufs"

          echo "── 2. Start dufs ──"
          docker run -d --name dufs-verify --platform "$PLAT" -p 5001:5000 \
            -e DUFS_ALLOW_ALL=true "$IMAGE"
          sleep 3

          echo "── 3. HTTP response (as browser) ──"
          BODY=$(curl -sf -A "$UA" http://localhost:5001/)
          echo "Response length: $(echo "$BODY" | wc -c) bytes"

          echo "── 4. Check Material UI ──"
          if echo "$BODY" | grep -q "__INITIAL_DATA__"; then
            echo "✅ Material UI SPA detected (__INITIAL_DATA__)"
          else
            echo "❌ Material UI NOT detected"
            docker stop dufs-verify
            exit 1
          fi

          docker stop dufs-verify
          echo "✅ [${{ matrix.platform }}] All checks passed"

  # ════════════════════════════════════════════════════════════════════════════
  #  Job 3: Push multi-platform image
  # ════════════════════════════════════════════════════════════════════════════
  push:
    runs-on: ubuntu-latest
    needs: [validate, build]
    steps:
      - uses: actions/checkout@v4

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Login to Alibaba Cloud ACR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.ACR_REGISTRY }}
          username: ${{ secrets.ACR_USERNAME }}
          password: ${{ secrets.ACR_PASSWORD }}

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: |
            ${{ env.DOCKERHUB_REPO }}
            ${{ env.ACR_REPO }}
          tags: |
            type=raw,value=v${{ needs.validate.outputs.version }}-fix
          labels: |
            org.opencontainers.image.title=dufs-material
            org.opencontainers.image.description=Dufs file server with Material Design UI (fix build)
            org.opencontainers.image.vendor=take7yo
            org.opencontainers.image.version=${{ needs.validate.outputs.version }}-fix

      # ── Build & push multi-platform ────────────────────────────────────────
      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile.src
          platforms: linux/amd64,linux/arm64,linux/arm/v7,linux/arm/v6,linux/386
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            DUFS_VERSION=${{ needs.validate.outputs.version }}
            DUFS_ASSETS_VERSION=${{ needs.validate.outputs.assets_version }}
          cache-from: |
            type=gha,scope=src-manual-linux/amd64
            type=gha,scope=src-manual-linux/arm64
            type=gha,scope=src-manual-linux/arm/v7
            type=gha,scope=src-manual-linux/arm/v6
            type=gha,scope=src-manual-linux/386
          cache-to: type=gha,mode=max

      - name: Summary
        run: |
          echo "## 🐳 Docker Image Published (fix build)" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "| Item | Value |" >> "$GITHUB_STEP_SUMMARY"
          echo "|------|-------|" >> "$GITHUB_STEP_SUMMARY"
          echo "| Build method | Source compilation (Rust + cross) |" >> "$GITHUB_STEP_SUMMARY"
          echo "| Version | \`${{ needs.validate.outputs.version }}\` |" >> "$GITHUB_STEP_SUMMARY"
          echo "| Assets version | \`${{ needs.validate.outputs.assets_version }}\` |" >> "$GITHUB_STEP_SUMMARY"
          echo "| Tag | \`v${{ needs.validate.outputs.version }}-fix\` |" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "| Registry | Image |" >> "$GITHUB_STEP_SUMMARY"
          echo "|----------|-------|" >> "$GITHUB_STEP_SUMMARY"
          echo "| Docker Hub | \`${{ env.DOCKERHUB_REPO }}:v${{ needs.validate.outputs.version }}-fix\` |" >> "$GITHUB_STEP_SUMMARY"
          echo "| 阿里云 ACR | \`${{ env.ACR_REPO }}:v${{ needs.validate.outputs.version }}-fix\` |" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "**Platforms:** linux/amd64, linux/arm64, linux/arm/v7, linux/arm/v6, linux/386 (5 platforms)" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "✅ All 5 platforms verified before push" >> "$GITHUB_STEP_SUMMARY"
