# docker-build-assets.yml
# Build # Build & Publish Docker Image — Source compilation with Material Assets UI Publish Docker Image — Source compilation with Material Assets UI
# Checks TransparentLC/dufs-material-assets for new releases
# Supports 5 Linux platforms: amd64, arm64, armv7, armv6, i386
name: Build & Publish Docker Image (Assets Version)
on:
  schedule:
    - cron: "27 3 * * *"
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      version:
        description: "dufs version (e.g. 0.46.0)"
        required: false
      assets_version:
        description: "Assets version (leave empty to use dufs version)"
        required: false
permissions:
  contents: write
env:
  DOCKERHUB_REPO: take7yo/dufs
  ACR_REGISTRY: registry.cn-hangzhou.aliyuncs.com
  ACR_REPO: registry.cn-hangzhou.aliyuncs.com/take7yo/dufs
jobs:
  check:
    runs-on: ubuntu-latest
    outputs:
      has_update: ${{ steps.check.outputs.has_update }}
      version: ${{ steps.check.outputs.version }}
      assets_version: ${{ steps.check.outputs.assets_version }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Check upstream
        id: check
        run: |
          if [ -n "${{ github.event.inputs.version }}" ]; then
            VERSION="${{ github.event.inputs.version }}"
            VERSION="${VERSION#v}"
            ASSETS_VERSION="${{ github.event.inputs.assets_version }}"
            ASSETS_VERSION="${ASSETS_VERSION#v}"
            if [ -z "$ASSETS_VERSION" ]; then ASSETS_VERSION="$VERSION"; fi
            echo "has_update=true" >> "$GITHUB_OUTPUT"
            echo "version=$VERSION" >> "$GITHUB_OUTPUT"
            echo "assets_version=$ASSETS_VERSION" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if [ "${{ github.event_name }}" = "release" ]; then
            VERSION="${GITHUB_REF_NAME#v}"
            echo "has_update=true" >> "$GITHUB_OUTPUT"
            echo "version=$VERSION" >> "$GITHUB_OUTPUT"
            echo "assets_version=$VERSION" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          UPSTREAM_TAG=$(curl -fsSL -H "Accept: application/vnd.github+json" "https://api.github.com/repos/TransparentLC/dufs-material-assets/releases/latest" | jq -r ".tag_name // empty")
          if [ -z "${UPSTREAM_TAG}" ]; then
            echo "has_update=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          UPSTREAM_VERSION="${UPSTREAM_TAG#v}"
          CURRENT_VERSION=$(cat CURRENT_VERSION_ASSETS 2>/dev/null || echo "0.0.0")
          if [ "${UPSTREAM_VERSION}" = "${CURRENT_VERSION}" ]; then
            echo "has_update=false" >> "$GITHUB_OUTPUT"
          else
            echo "has_update=true" >> "$GITHUB_OUTPUT"
            echo "version=$UPSTREAM_VERSION" >> "$GITHUB_OUTPUT"
            echo "assets_version=$UPSTREAM_VERSION" >> "$GITHUB_OUTPUT"
          fi
  build:
    runs-on: ubuntu-latest
    needs: check
    if: needs.check.outputs.has_update == 'true'
    strategy:
      fail-fast: true
      matrix:
        include:
          - platform: linux/amd64
            tag: amd64
          - platform: linux/arm64
            tag: arm64
          - platform: linux/arm/v7
            tag: armv7
          - platform: linux/arm/v6
            tag: armv6
          - platform: linux/386
            tag: i386
    steps:
      - uses: actions/checkout@v4
      - name: Save version
        if: matrix.platform == 'linux/amd64'
        run: echo "${{ needs.check.outputs.version }}" > CURRENT_VERSION_ASSETS
      - name: Commit version
        if: matrix.platform == 'linux/amd64'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add CURRENT_VERSION_ASSETS
          git diff --cached --quiet || git commit -m "chore: bump assets version to ${{ needs.check.outputs.version }}"
          git push || echo "::warning::Could not push"
      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      - name: Build test
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile.assets
          target: test
          load: true
          tags: dufs-assets-test:${{ matrix.tag }}
          platforms: ${{ matrix.platform }}
          build-args: |
            DUFS_VERSION=${{ needs.check.outputs.version }}
            DUFS_ASSETS_VERSION=${{ needs.check.outputs.assets_version }}
          cache-from: type=gha,scope=src-${{ matrix.platform }}
          cache-to: type=gha,scope=src-${{ matrix.platform }},mode=max
      - name: Verify
        run: |
          IMAGE="dufs-assets-test:${{ matrix.tag }}"
          PLAT="${{ matrix.platform }}"
          docker run --rm --platform "$PLAT" --entrypoint sh "$IMAGE" -c "ls -lh /usr/local/bin/dufs"
          docker run -d --name dufs-verify --platform "$PLAT" -p 5002:5000 -e DUFS_ALLOW_ALL=true "$IMAGE"
          sleep 3
          BODY=$(curl -sf http://localhost:5002/)
          if echo "$BODY" | grep -q "__INITIAL_DATA__"; then
            echo "Material UI detected"
          else
            echo "Material UI NOT detected"
            docker stop dufs-verify
            exit 1
          fi
          docker stop dufs-verify
          echo "All checks passed"
  push:
    runs-on: ubuntu-latest
    needs: [check, build]
    steps:
      - uses: actions/checkout@v4
      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - name: Login to ACR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.ACR_REGISTRY }}
          username: ${{ secrets.ACR_USERNAME }}
          password: ${{ secrets.ACR_PASSWORD }}
      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      - name: Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: |
            ${{ env.DOCKERHUB_REPO }}
            ${{ env.ACR_REPO }}
          tags: |
            type=raw,value=v${{ needs.check.outputs.version }}
            type=raw,value=latest
          labels: |
            org.opencontainers.image.title=dufs-material
            org.opencontainers.image.description=Dufs file server with Material Design UI (assets version)
            org.opencontainers.image.vendor=take7yo
            org.opencontainers.image.version=${{ needs.check.outputs.version }}
      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile.assets
          platforms: linux/amd64,linux/arm64,linux/arm/v7,linux/arm/v6,linux/386
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            DUFS_VERSION=${{ needs.check.outputs.version }}
            DUFS_ASSETS_VERSION=${{ needs.check.outputs.assets_version }}
          cache-from: |
            type=gha,scope=src-linux/amd64
            type=gha,scope=src-linux/arm64
            type=gha,scope=src-linux/arm/v7
            type=gha,scope=src-linux/arm/v6
            type=gha,scope=src-linux/386
          cache-to: type=gha,mode=max
      - name: Summary
        run: |
          echo "## Docker Image Published (Assets Version)" >> "$GITHUB_STEP_SUMMARY"
          echo "Version: ${{ needs.check.outputs.version }}" >> "$GITHUB_STEP_SUMMARY"
          echo "Tag: v${{ needs.check.outputs.version }}" >> "$GITHUB_STEP_SUMMARY"
          echo "Platforms: linux/amd64, linux/arm64, linux/arm/v7, linux/arm/v6, linux/386" >> "$GITHUB_STEP_SUMMARY"
          echo "Build method: Source compilation (Rust + cross)" >> "$GITHUB_STEP_SUMMARY"
