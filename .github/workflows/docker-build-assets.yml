# ──────────────────────────────────────────────────────────────────────────────
#  docker-build-assets.yml – Build & publish Docker image (assets version)
#
#  Trigger: push (testing), schedule, release, workflow_dispatch
#  Platforms: amd64, arm64, arm/v7, arm/v6, i386
#  Tags: v{version}, latest
# ──────────────────────────────────────────────────────────────────────────────
name: Build (Assets)

on:
  schedule:
    - cron: "27 3 * * *"
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      version:
        description: "dufs version (e.g. 0.46.0)"
        required: false
      assets_version:
        description: "Assets version (leave empty to use dufs version)"
        required: false
permissions:
  contents: write

env:
  DOCKERHUB_REPO: take7yo/dufs
  ACR_REGISTRY: registry.cn-hangzhou.aliyuncs.com
  ACR_REPO: registry.cn-hangzhou.aliyuncs.com/take7yo/dufs

jobs:
  check:
    runs-on: ubuntu-latest
    outputs:
      has_update: ${{ steps.check.outputs.has_update }}
      version: ${{ steps.check.outputs.version }}
      assets_version: ${{ steps.check.outputs.assets_version }}
    steps:
      - uses: actions/checkout@v4

      - name: Check upstream
        id: check
        run: |
          if [ -n "${{ github.event.inputs.version }}" ]; then
            VERSION="${{ github.event.inputs.version }}"
            VERSION="${VERSION#v}"
            ASSETS_VERSION="${{ github.event.inputs.assets_version }}"
            ASSETS_VERSION="${ASSETS_VERSION#v}"
            [ -z "$ASSETS_VERSION" ] && ASSETS_VERSION="$VERSION"
            echo "has_update=true" >> "$GITHUB_OUTPUT"
            echo "version=$VERSION" >> "$GITHUB_OUTPUT"
            echo "assets_version=$ASSETS_VERSION" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          UPSTREAM_TAG=$(curl -fsSL \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/TransparentLC/dufs-material-assets/releases/latest" \
            | python3 -c "import sys,json; print(json.load(sys.stdin).get('tag_name','').lstrip('v'))")

          if [ -z "$UPSTREAM_TAG" ]; then
            echo "has_update=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          CURRENT=$(cat CURRENT_VERSION_ASSETS 2>/dev/null || echo "0.0.0")
          if [ "$UPSTREAM_TAG" = "$CURRENT" ]; then
            echo "has_update=false" >> "$GITHUB_OUTPUT"
          else
            echo "has_update=true" >> "$GITHUB_OUTPUT"
            echo "version=$UPSTREAM_TAG" >> "$GITHUB_OUTPUT"
            echo "assets_version=$UPSTREAM_TAG" >> "$GITHUB_OUTPUT"
          fi

  build:
    runs-on: ubuntu-latest
    needs: check
    if: needs.check.outputs.has_update == 'true'
    strategy:
      fail-fast: true
      matrix:
        include:
          - platform: linux/amd64
            target: x86_64-unknown-linux-musl
          - platform: linux/arm64
            target: aarch64-unknown-linux-musl
          - platform: linux/arm/v7
            target: armv7-unknown-linux-musleabihf
          - platform: linux/arm/v6
            target: arm-unknown-linux-musleabihf
          - platform: linux/386
            target: i686-unknown-linux-musl
    steps:
      - uses: actions/checkout@v4

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Install cross
        uses: taiki-e/install-action@v2
        with:
          tool: cross

      - name: Clone dufs source
        run: |
          git clone --depth 1 --branch "v${{ needs.check.outputs.version }}" \
            https://github.com/sigoden/dufs.git dufs-src

      - name: Download assets
        run: |
          curl -fsSL \
            "https://github.com/TransparentLC/dufs-material-assets/releases/download/v${{ needs.check.outputs.assets_version }}/dufs-material-assets-embed.zip" \
            -o assets.zip
          mkdir -p assets
          unzip -q assets.zip -d assets-tmp
          CONTENTS=$(ls assets-tmp)
          if [ "$(echo "$CONTENTS" | wc -l)" = 1 ] && [ -d "assets-tmp/$CONTENTS" ]; then
            cp -a assets-tmp/$CONTENTS/* assets/
          else
            cp -a assets-tmp/* assets/
          fi
          rm -rf assets.zip assets-tmp

      - name: Build dufs binary
        working-directory: dufs-src
        run: cross build --locked --release --target=${{ matrix.target }}
        env:
          RUST_BACKTRACE: 1

      - name: Copy binary
        run: |
          cp dufs-src/target/${{ matrix.target }}/release/dufs ./dufs
          chmod +x ./dufs

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build test image
        # Skip for linux/arm/v6 because debian:bookworm-slim no longer provides
        # a manifest for this platform (upstream removed it between 2026-07-21
        # and 2026-08-16).
        if: matrix.platform != 'linux/arm/v6'
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile.assets
          target: test
          load: true
          tags: dufs-assets-test:${{ matrix.target }}
          platforms: ${{ matrix.platform }}

      - name: Verify image
        # Skip for linux/arm/v6 for the same reason as above.
        if: matrix.platform != 'linux/arm/v6'
        run: |
          IMAGE="dufs-assets-test:${{ matrix.target }}"
          PLAT="${{ matrix.platform }}"
          UA="Mozilla/5.0 (X11; Linux x86_64) AppleWebKit/537.36 Chrome/120.0.0.0"

          echo "Binary info:"
          docker run --rm --platform "$PLAT" --entrypoint sh "$IMAGE" \
            -c "ls -lh /bin/dufs"

          docker run -d --name dufs-verify --platform "$PLAT" -p 5000:5000 \
            -e DUFS_ALLOW_ALL=true "$IMAGE"
          sleep 3

          BODY=$(curl -sf -A "$UA" http://localhost:5000/)
          if echo "$BODY" | grep -q "__INITIAL_DATA__"; then
            echo "Material UI detected"
          else
            echo "Material UI NOT detected"
            docker stop dufs-verify
            exit 1
          fi

          docker stop dufs-verify
          echo "Verification passed for ${{ matrix.platform }}"

      - name: Upload binary
        uses: actions/upload-artifact@v4
        with:
          name: dufs-${{ matrix.target }}
          path: dufs

      - name: Upload assets
        uses: actions/upload-artifact@v4
        with:
          name: assets-${{ matrix.target }}
          path: assets/

  push:
    runs-on: ubuntu-latest
    needs: [check, build]
    steps:
      - uses: actions/checkout@v4

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts
          pattern: "{dufs,assets}-*"


      - name: Debug artifacts
        run: |
          echo "Listing artifacts directory:"
          ls -la artifacts/ 2>/dev/null || echo "No artifacts directory"
          echo ""
          echo "Looking for dufs binaries:"
          find artifacts/ -name "dufs" -type f 2>/dev/null || echo "No dufs found"
          echo ""
          echo "Looking for assets:"
          find artifacts/ -name "assets" -type d 2>/dev/null || echo "No assets found"

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Login to ACR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.ACR_REGISTRY }}
          username: ${{ secrets.ACR_USERNAME }}
          password: ${{ secrets.ACR_PASSWORD }}

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # Build and push each platform as a separate image by digest.
      # We must build per-platform because each architecture needs a
      # different pre-compiled binary. The digests are collected and
      # merged into a multi-arch manifest in the next step.
      - name: Build and push per-platform images
        run: |
          VERSION="${{ needs.check.outputs.version }}"

          # Platform mapping: buildx-platform  →  Rust target triple
          declare -A PLATFORM_MAP=(
            ["amd64"]="x86_64-unknown-linux-musl"
            ["arm64"]="aarch64-unknown-linux-musl"
            ["armv7"]="armv7-unknown-linux-musleabihf"
            ["armv6"]="arm-unknown-linux-musleabihf"
            ["i386"]="i686-unknown-linux-musl"
          )

          mkdir -p /tmp/digests

          for PLAT in amd64 arm64 armv7 armv6 i386; do
            TARGET="${PLATFORM_MAP[$PLAT]}"
            BUILD_DIR="/tmp/build-${PLAT}"

            # Assemble per-platform build context
            mkdir -p "${BUILD_DIR}/assets"
            cp "artifacts/dufs-${TARGET}/dufs" "${BUILD_DIR}/"
            chmod +x "${BUILD_DIR}/dufs"
            cp -r "artifacts/assets-${TARGET}/"* "${BUILD_DIR}/assets/" 2>/dev/null || true
            cp Dockerfile.assets "${BUILD_DIR}/"

            # Build and push by digest using metadata file
            docker buildx build \
              --provenance=false \
              --sbom=false \
              --platform "linux/${PLAT}" \
              --file "${BUILD_DIR}/Dockerfile.assets" \
              --target final \
              --label "org.opencontainers.image.title=dufs-material" \
              --label "org.opencontainers.image.description=Dufs file server with Material Design UI (assets version)" \
              --label "org.opencontainers.image.vendor=take7yo" \
              --label "org.opencontainers.image.version=${VERSION}" \
              --output "type=image,name=${{ env.DOCKERHUB_REPO }},push-by-digest=true,name-canonical=true,push=true" \
              --metadata-file "/tmp/metadata-${PLAT}.json" \
              "${BUILD_DIR}"

            # Extract digest from metadata
            DIGEST=$(jq -r '."containerimage.digest"' "/tmp/metadata-${PLAT}.json")
            echo "${DIGEST}" > "/tmp/digests/${PLAT}"
            echo "Pushed linux/${PLAT}: ${DIGEST}"
          done

      # Assemble per-platform digests into multi-arch manifests
      - name: Create and push multi-arch manifests
        run: |
          VERSION="${{ needs.check.outputs.version }}"
          TAGS=("v${VERSION}" "latest")

          # Collect digest references
          DIGEST_REFS=""
          for PLAT in amd64 arm64 armv7 armv6 i386; do
            DIGEST=$(cat "/tmp/digests/${PLAT}")
            DIGEST_REFS="${DIGEST_REFS} ${{ env.DOCKERHUB_REPO }}@${DIGEST}"
          done

          # Push manifest to each registry
          for TAG in "${TAGS[@]}"; do
            echo "Creating manifest: v${TAG}"
            docker buildx imagetools create \
              --tag "${{ env.DOCKERHUB_REPO }}:${TAG}" \
              --tag "${{ env.ACR_REPO }}:${TAG}" \
              ${DIGEST_REFS}
          done

      - name: Update version file
        run: |
          ASSETS_VERSION="${{ needs.check.outputs.assets_version }}"
          echo "${ASSETS_VERSION}" > CURRENT_VERSION_ASSETS
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add CURRENT_VERSION_ASSETS
          git diff --cached --quiet || git commit -m "chore: bump assets version to ${ASSETS_VERSION}"
          git push || echo "::warning::Could not push version update"

      - name: Summary
        run: |
          echo "## Docker Image Published (Assets Version)" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "| Item | Value |" >> "$GITHUB_STEP_SUMMARY"
          echo "|------|-------|" >> "$GITHUB_STEP_SUMMARY"
          echo "| Version | \`${{ needs.check.outputs.version }}\` |" >> "$GITHUB_STEP_SUMMARY"
          echo "| Tags | \`v${{ needs.check.outputs.version }}\`, \`latest\` |" >> "$GITHUB_STEP_SUMMARY"
          echo "| Platforms | linux/amd64, linux/arm64, linux/arm/v7, linux/arm/v6, linux/386 |" >> "$GITHUB_STEP_SUMMARY"
          echo "| Build method | Cross-compiled (Rust stable + cross) |" >> "$GITHUB_STEP_SUMMARY"
