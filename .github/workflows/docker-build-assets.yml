# ──────────────────────────────────────────────────────────────────────────────
#  docker-build-assets.yml – Build & publish Docker image (assets version)
#
#  Trigger: schedule (daily 03:27 UTC), release, workflow_dispatch
#  Platforms: amd64, arm64, armv7, armv6, i386
#  Tags: v{version}, latest
# ──────────────────────────────────────────────────────────────────────────────
name: Build (Assets)

on:
  schedule:
    - cron: "27 3 * * *"
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      version:
        description: "dufs version (e.g. 0.46.0)"
        required: false
      assets_version:
        description: "Assets version (leave empty to use dufs version)"
        required: false

permissions:
  contents: write

env:
  DOCKERHUB_REPO: take7yo/dufs
  ACR_REGISTRY: registry.cn-hangzhou.aliyuncs.com
  ACR_REPO: registry.cn-hangzhou.aliyuncs.com/take7yo/dufs

# ──────────────────────────────────────────────────────────────────────────────
jobs:
  check:
    runs-on: ubuntu-latest
    outputs:
      has_update: ${{ steps.check.outputs.has_update }}
      version: ${{ steps.check.outputs.version }}
      assets_version: ${{ steps.check.outputs.assets_version }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Check upstream
        id: check
        run: |
          if [ -n "${{ github.event.inputs.version }}" ]; then
            VERSION="${{ github.event.inputs.version }}"
            VERSION="${VERSION#v}"
            ASSETS_VERSION="${{ github.event.inputs.assets_version }}"
            ASSETS_VERSION="${ASSETS_VERSION#v}"
            if [ -z "$ASSETS_VERSION" ]; then ASSETS_VERSION="$VERSION"; fi
            echo "has_update=true" >> "$GITHUB_OUTPUT"
            echo "version=$VERSION" >> "$GITHUB_OUTPUT"
            echo "assets_version=$ASSETS_VERSION" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if [ "${{ github.event_name }}" = "release" ]; then
            VERSION="${GITHUB_REF_NAME#v}"
            echo "has_update=true" >> "$GITHUB_OUTPUT"
            echo "version=$VERSION" >> "$GITHUB_OUTPUT"
            echo "assets_version=$VERSION" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          UPSTREAM_TAG=$(curl -fsSL \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/TransparentLC/dufs-material-assets/releases/latest" \
            | jq -r ".tag_name // empty")
          if [ -z "${UPSTREAM_TAG}" ]; then
            echo "has_update=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          UPSTREAM_VERSION="${UPSTREAM_TAG#v}"
          CURRENT_VERSION=$(cat CURRENT_VERSION_ASSETS 2>/dev/null || echo "0.0.0")
          if [ "${UPSTREAM_VERSION}" = "${CURRENT_VERSION}" ]; then
            echo "has_update=false" >> "$GITHUB_OUTPUT"
          else
            echo "has_update=true" >> "$GITHUB_OUTPUT"
            echo "version=$UPSTREAM_VERSION" >> "$GITHUB_OUTPUT"
            echo "assets_version=$UPSTREAM_VERSION" >> "$GITHUB_OUTPUT"
          fi

  build:
    runs-on: ubuntu-latest
    needs: check
    if: needs.check.outputs.has_update == 'true'
    strategy:
      fail-fast: true
      matrix:
        include:
          - platform: linux/amd64
            tag: amd64
            rust_target: x86_64-unknown-linux-musl
            use_cross: false
          - platform: linux/arm64
            tag: arm64
            rust_target: aarch64-unknown-linux-musl
            use_cross: true
          - platform: linux/arm/v7
            tag: armv7
            rust_target: armv7-unknown-linux-musleabihf
            use_cross: true
          - platform: linux/arm/v6
            tag: armv6
            rust_target: arm-unknown-linux-musleabihf
            use_cross: true
          - platform: linux/386
            tag: i386
            rust_target: i686-unknown-linux-musl
            use_cross: true
    steps:
      - uses: actions/checkout@v4

      - name: "[amd64] Save version"
        if: matrix.platform == 'linux/amd64'
        run: echo "${{ needs.check.outputs.version }}" > CURRENT_VERSION_ASSETS

      - name: "[amd64] Commit version"
        if: matrix.platform == 'linux/amd64'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add CURRENT_VERSION_ASSETS
          git diff --cached --quiet || git commit -m "chore: bump assets version to ${{ needs.check.outputs.version }}"
          git push || echo "::warning::Could not push"

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install cross
        if: matrix.use_cross
        uses: taiki-e/install-action@v2
        with:
          tool: cross

      - name: Clone dufs source
        run: |
          git clone --depth 1 --branch "v${{ needs.check.outputs.version }}" \
            https://github.com/sigoden/dufs.git dufs-src

      - name: Download assets
        run: |
          curl -fsSL "https://github.com/TransparentLC/dufs-material-assets/releases/download/v${{ needs.check.outputs.assets_version }}/dufs-material-assets-embed.zip" -o assets.zip
          mkdir -p assets
          unzip -q assets.zip -d assets-tmp
          CONTENTS=$(ls assets-tmp)
          if [ "$(echo "$CONTENTS" | wc -l)" = 1 ] && [ -d "assets-tmp/$CONTENTS" ]; then
            cp -a assets-tmp/$CONTENTS/* assets/
          else
            cp -a assets-tmp/* assets/
          fi
          rm -rf assets.zip assets-tmp

      - name: Build dufs binary
        working-directory: dufs-src
        run: |
          if [ "${{ matrix.use_cross }}" = "true" ]; then
            cross build --locked --release --target=${{ matrix.rust_target }}
          else
            cargo build --locked --release --target=${{ matrix.rust_target }}
          fi
          cp target/${{ matrix.rust_target }}/release/dufs ../dufs
          chmod +x ../dufs

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: "[${{ matrix.tag }}] Build test image"
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile.assets
          target: test
          load: true
          tags: dufs-assets-test:${{ matrix.tag }}
          platforms: ${{ matrix.platform }}

      - name: "[${{ matrix.tag }}] Verify image"
        run: |
          IMAGE="dufs-assets-test:${{ matrix.tag }}"
          PLAT="${{ matrix.platform }}"
          UA="Mozilla/5.0 (X11; Linux x86_64) AppleWebKit/537.36 Chrome/120.0.0.0"
          docker run --rm --platform "$PLAT" --entrypoint sh "$IMAGE" -c "ls -lh /usr/local/bin/dufs"
          docker run -d --name dufs-verify --platform "$PLAT" -p 5000:5000 -e DUFS_ALLOW_ALL=true "$IMAGE"
          sleep 3
          BODY=$(curl -sf -A "$UA" http://localhost:5000/)
          if echo "$BODY" | grep -q "__INITIAL_DATA__"; then
            echo "Material UI detected"
          else
            echo "Material UI NOT detected"
            docker stop dufs-verify
            exit 1
          fi
          docker stop dufs-verify
          echo "All checks passed"

      - name: Save binary as artifact
        uses: actions/upload-artifact@v4
        with:
          name: dufs-${{ matrix.tag }}
          path: dufs
          retention-days: 1

  push:
    runs-on: ubuntu-latest
    needs: [check, build]
    steps:
      - uses: actions/checkout@v4

      - name: Download all platform artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts
          pattern: dufs-*

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Login to ACR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.ACR_REGISTRY }}
          username: ${{ secrets.ACR_USERNAME }}
          password: ${{ secrets.ACR_PASSWORD }}

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push per-platform images
        run: |
          VERSION="${{ needs.check.outputs.version }}"
          PLATFORMS="linux/amd64:amd64 linux/arm64:arm64 linux/arm/v7:armv7 linux/arm/v6:armv6 linux/386:i386"
          for ENTRY in $PLATFORMS; do
            PLAT=$(echo "$ENTRY" | cut -d: -f1)
            TAG=$(echo "$ENTRY" | cut -d: -f2)
            echo "=== Building and pushing $PLAT ==="
            cp "artifacts/dufs-$TAG/dufs" ./dufs
            TAG_ARGS=""
            TAG_ARGS="$TAG_ARGS --tag ${{ env.DOCKERHUB_REPO }}:v${VERSION}-${TAG}"
            TAG_ARGS="$TAG_ARGS --tag ${{ env.ACR_REPO }}:v${VERSION}-${TAG}"
            docker buildx build \
              --platform "$PLAT" \
              --file Dockerfile.assets \
              --target final \
              --provenance=false \
              --push \
              --label "org.opencontainers.image.title=dufs-material" \
              --label "org.opencontainers.image.description=Dufs file server with Material Design UI (assets version)" \
              --label "org.opencontainers.image.vendor=take7yo" \
              --label "org.opencontainers.image.version=${VERSION}" \
              $TAG_ARGS \
              .
            echo "Pushed: $PLAT"
            rm -f ./dufs
          done

      - name: Create multi-platform manifest
        run: |
          VERSION="${{ needs.check.outputs.version }}"
          TAG_NAMES="v${VERSION} latest"
          for REGISTRY in "${{ env.DOCKERHUB_REPO }}" "${{ env.ACR_REPO }}"; do
            for TAG_NAME in $TAG_NAMES; do
              FULL_TAG="${REGISTRY}:${TAG_NAME}"
              PLATFORM_IMAGES=""
              for PLAT_TAG in amd64 arm64 armv7 armv6 i386; do
                PLATFORM_IMAGES="$PLATFORM_IMAGES ${REGISTRY}:v${VERSION}-${PLAT_TAG}"
              done
              echo "Creating manifest: $FULL_TAG"
              docker buildx imagetools create \
                --tag "$FULL_TAG" \
                $PLATFORM_IMAGES || echo "::warning::Could not create manifest for $FULL_TAG"
            done
          done

      - name: Summary
        run: |
          echo "## Docker Image Published (Assets Version)" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "| Item | Value |" >> "$GITHUB_STEP_SUMMARY"
          echo "|------|-------|" >> "$GITHUB_STEP_SUMMARY"
          echo "| Version | \`${{ needs.check.outputs.version }}\` |" >> "$GITHUB_STEP_SUMMARY"
          echo "| Assets version | \`${{ needs.check.outputs.assets_version }}\` |" >> "$GITHUB_STEP_SUMMARY"
          echo "| Tags | \`v${{ needs.check.outputs.version }}\`, \`latest\` |" >> "$GITHUB_STEP_SUMMARY"
          echo "| Platforms | linux/amd64, linux/arm64, linux/arm/v7, linux/arm/v6, linux/386 |" >> "$GITHUB_STEP_SUMMARY"
          echo "| Build method | Cross-compiled (Rust stable + cross) |" >> "$GITHUB_STEP_SUMMARY"
