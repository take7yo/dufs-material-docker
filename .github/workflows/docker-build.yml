# ──────────────────────────────────────────────────────────────────────────────
#  docker-build.yml – Build & publish take7yo/dufs Docker image
#
#  Registries:
#    • Docker Hub   – docker.io/take7yo/dufs
#    • 阿里云 ACR    – registry.cn-hangzhou.aliyuncs.com/take7yo/dufs
#
#  Triggers:
#    • schedule  – daily at 03:17 UTC, auto-builds when upstream has a new tag
#    • release   – when THIS repo cuts a GitHub Release
#    • workflow_dispatch – manual trigger with optional version override
# ──────────────────────────────────────────────────────────────────────────────
name: Build & Publish Docker Image

on:
  schedule:
    - cron: "17 3 * * *"

  release:
    types: [published]

  workflow_dispatch:
    inputs:
      version:
        description: "dufs / material-assets version (e.g. 0.46.0)"
        required: false

permissions:
  contents: read

env:
  DOCKERHUB_REPO: take7yo/dufs
  ACR_REGISTRY: registry.cn-hangzhou.aliyuncs.com
  ACR_REPO: registry.cn-hangzhou.aliyuncs.com/take7yo/dufs

# ──────────────────────────────────────────────────────────────────────────────
jobs:
  # ════════════════════════════════════════════════════════════════════════════
  #  Job 1: Check if upstream has a new release
  # ════════════════════════════════════════════════════════════════════════════
  check:
    runs-on: ubuntu-latest
    outputs:
      has_update: ${{ steps.check.outputs.has_update }}
      version:    ${{ steps.check.outputs.version }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Check upstream for new release
        id: check
        run: |
          if [ -n "${{ github.event.inputs.version }}" ]; then
            VERSION="${{ github.event.inputs.version }}"
            echo "Manual dispatch: version=${VERSION}"
            echo "has_update=true" >> "$GITHUB_OUTPUT"
            echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          if [ "${{ github.event_name }}" = "release" ]; then
            VERSION="${GITHUB_REF_NAME#v}"
            echo "Release event: version=${VERSION}"
            echo "has_update=true" >> "$GITHUB_OUTPUT"
            echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          echo "Scheduled run: checking upstream TransparentLC/dufs-material-assets"
          UPSTREAM_TAG=$(curl -fsSL \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/TransparentLC/dufs-material-assets/releases/latest" \
            | jq -r '.tag_name // empty')

          if [ -z "${UPSTREAM_TAG}" ]; then
            echo "::warning::Could not fetch upstream release tag"
            echo "has_update=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          UPSTREAM_VERSION="${UPSTREAM_TAG#v}"
          echo "Upstream latest: ${UPSTREAM_VERSION}"

          CURRENT_VERSION=$(cat CURRENT_VERSION 2>/dev/null || echo "0.0.0")
          echo "Current built version: ${CURRENT_VERSION}"

          if [ "${UPSTREAM_VERSION}" = "${CURRENT_VERSION}" ]; then
            echo "Already up to date (${CURRENT_VERSION})"
            echo "has_update=false" >> "$GITHUB_OUTPUT"
          else
            echo "New version available: ${CURRENT_VERSION} → ${UPSTREAM_VERSION}"
            echo "has_update=true" >> "$GITHUB_OUTPUT"
            echo "version=${UPSTREAM_VERSION}" >> "$GITHUB_OUTPUT"
          fi

  # ════════════════════════════════════════════════════════════════════════════
  #  Job 2: Build & push multi-platform Docker image
  # ════════════════════════════════════════════════════════════════════════════
  build:
    runs-on: ubuntu-latest
    needs: check
    if: needs.check.outputs.has_update == 'true'
    steps:
      - uses: actions/checkout@v4

      # ── Save version for next scheduled run ────────────────────────────────
      - name: Save current version
        run: echo "${{ needs.check.outputs.version }}" > CURRENT_VERSION

      - name: Commit version file
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add CURRENT_VERSION
          git diff --cached --quiet || git commit -m "chore: bump version to ${{ needs.check.outputs.version }}"
          git push || echo "::warning::Could not push version file"

      # ── Login: Docker Hub ──────────────────────────────────────────────────
      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      # ── Login: 阿里云 ACR ──────────────────────────────────────────────────
      - name: Login to Alibaba Cloud ACR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.ACR_REGISTRY }}
          username: ${{ secrets.ACR_USERNAME }}
          password: ${{ secrets.ACR_PASSWORD }}

      # ── QEMU + Buildx ─────────────────────────────────────────────────────
      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # ── Image metadata & tags ──────────────────────────────────────────────
      - name: Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: |
            ${{ env.DOCKERHUB_REPO }}
            ${{ env.ACR_REPO }}
          tags: |
            type=raw,value=latest
            type=raw,value=v${{ needs.check.outputs.version }}
          labels: |
            org.opencontainers.image.title=dufs-material
            org.opencontainers.image.description=Dufs file server with Material Design UI
            org.opencontainers.image.vendor=take7yo
            org.opencontainers.image.version=${{ needs.check.outputs.version }}

      # ── Build & push ───────────────────────────────────────────────────────
      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64,linux/arm/v7
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            DUFS_VERSION=${{ needs.check.outputs.version }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # ── Summary ────────────────────────────────────────────────────────────
      - name: Image digest
        run: |
          echo "## 🐳 Docker Image Published" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "| Registry | Image |" >> "$GITHUB_STEP_SUMMARY"
          echo "|----------|-------|" >> "$GITHUB_STEP_SUMMARY"
          echo "| Docker Hub | \`${{ env.DOCKERHUB_REPO }}:v${{ needs.check.outputs.version }}\` |" >> "$GITHUB_STEP_SUMMARY"
          echo "| 阿里云 ACR | \`${{ env.ACR_REPO }}:v${{ needs.check.outputs.version }}\` |" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "**Platforms:** linux/amd64, linux/arm64, linux/arm/v7" >> "$GITHUB_STEP_SUMMARY"
