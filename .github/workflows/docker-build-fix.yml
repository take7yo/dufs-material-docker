# ──────────────────────────────────────────────────────────────────────────────
#  docker-build-fix.yml – Manual build & publish Docker image (fix version)
#
#  Trigger: workflow_dispatch only (manual)
#  Platforms: amd64, arm64, armv7, armv6, i386
#  Tags: v{version}-fix, latest
# ──────────────────────────────────────────────────────────────────────────────
name: Build (Fix)

on:
  workflow_dispatch:
    inputs:
      version:
        description: "dufs version (e.g. 0.46.0)"
        required: true
        type: string
      assets_version:
        description: "Assets version (leave empty to use dufs version)"
        required: false
        type: string

permissions:
  contents: write

env:
  DOCKERHUB_REPO: take7yo/dufs
  ACR_REGISTRY: registry.cn-hangzhou.aliyuncs.com
  ACR_REPO: registry.cn-hangzhou.aliyuncs.com/take7yo/dufs

# ──────────────────────────────────────────────────────────────────────────────
jobs:
  check:
    runs-on: ubuntu-latest
    outputs:
      has_update: ${{ steps.check.outputs.has_update }}
      version: ${{ steps.check.outputs.version }}
      assets_version: ${{ steps.check.outputs.assets_version }}
    steps:
      - name: Validate inputs
        id: check
        run: |
          VERSION="${{ github.event.inputs.version }}"
          ASSETS_VERSION="${{ github.event.inputs.assets_version }}"
          VERSION="${VERSION#v}"
          ASSETS_VERSION="${ASSETS_VERSION#v}"
          if [ -z "$ASSETS_VERSION" ]; then
            ASSETS_VERSION="$VERSION"
          fi
          echo "Version       : ${VERSION}"
          echo "Assets version: ${ASSETS_VERSION}"
          echo "has_update=true" >> "$GITHUB_OUTPUT"
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "assets_version=${ASSETS_VERSION}" >> "$GITHUB_OUTPUT"

      - name: Verify assets release exists
        run: |
          ASSETS_VERSION="${{ steps.check.outputs.assets_version }}"
          URL="https://github.com/TransparentLC/dufs-material-assets/releases/download/v${ASSETS_VERSION}/dufs-material-assets-embed.zip"
          echo "Checking: ${URL}"
          HTTP_CODE=$(curl -sLo /dev/null -w "%{http_code}" "$URL")
          if [ "$HTTP_CODE" != "200" ]; then
            echo "::error::Assets not found at ${URL} (HTTP ${HTTP_CODE})"
            exit 1
          fi
          echo "Assets release v${ASSETS_VERSION} exists"

  build:
    runs-on: ubuntu-latest
    needs: check
    strategy:
      fail-fast: true
      matrix:
        include:
          - platform: linux/amd64
            target: x86_64-unknown-linux-musl
          - platform: linux/arm64
            target: aarch64-unknown-linux-musl
          - platform: linux/arm/v7
            target: armv7-unknown-linux-musleabihf
          - platform: linux/arm/v6
            target: arm-unknown-linux-musleabihf
          - platform: linux/386
            target: i686-unknown-linux-musl
    steps:
      - uses: actions/checkout@v4

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Install cross
        uses: taiki-e/install-action@v2
        with:
          tool: cross

      - name: Clone dufs source
        run: |
          git clone --depth 1 --branch "v${{ needs.check.outputs.version }}" \
            https://github.com/sigoden/dufs.git dufs-src

      - name: Download assets
        run: |
          curl -fsSL "https://github.com/TransparentLC/dufs-material-assets/releases/download/v${{ needs.check.outputs.assets_version }}/dufs-material-assets-embed.zip" -o assets.zip
          mkdir -p assets
          unzip -q assets.zip -d assets-tmp
          CONTENTS=$(ls assets-tmp)
          if [ "$(echo "$CONTENTS" | wc -l)" = 1 ] && [ -d "assets-tmp/$CONTENTS" ]; then
            cp -a assets-tmp/$CONTENTS/* assets/
          else
            cp -a assets-tmp/* assets/
          fi
          rm -rf assets.zip assets-tmp

      - name: Build dufs binary
        working-directory: dufs-src
        run: cross build --locked --release --target=${{ matrix.target }}
        env:
          RUST_BACKTRACE: 1

      - name: Copy binary
        run: |
          cp dufs-src/target/${{ matrix.target }}/release/dufs ./dufs
          chmod +x ./dufs

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build test image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile.fix
          target: test
          load: true
          tags: dufs-fix-test:${{ matrix.target }}
          platforms: ${{ matrix.platform }}

      - name: Verify image
        run: |
          IMAGE="dufs-fix-test:${{ matrix.target }}"
          PLAT="${{ matrix.platform }}"
          UA="Mozilla/5.0 (X11; Linux x86_64) AppleWebKit/537.36 Chrome/120.0.0.0"
          docker run --rm --platform "$PLAT" --entrypoint sh "$IMAGE" -c "ls -lh /usr/local/bin/dufs"
          docker run -d --name dufs-verify --platform "$PLAT" -p 5000:5000 -e DUFS_ALLOW_ALL=true "$IMAGE"
          sleep 3
          BODY=$(curl -sf -A "$UA" http://localhost:5000/)
          if echo "$BODY" | grep -q "__INITIAL_DATA__"; then
            echo "Material UI detected"
          else
            echo "Material UI NOT detected"
            docker stop dufs-verify
            exit 1
          fi
          docker stop dufs-verify
          echo "All checks passed"

      - name: Save binary as artifact
        uses: actions/upload-artifact@v4
        with:
          name: dufs-${{ matrix.target }}
          path: dufs
          retention-days: 1

      - name: Upload assets
        uses: actions/upload-artifact@v4
        with:
          name: assets-${{ matrix.target }}
          path: assets/
          retention-days: 1

  push:
    runs-on: ubuntu-latest
    needs: [check, build]
    steps:
      - uses: actions/checkout@v4

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts
          pattern: "*"

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Login to ACR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.ACR_REGISTRY }}
          username: ${{ secrets.ACR_USERNAME }}
          password: ${{ secrets.ACR_PASSWORD }}

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # Build and push each platform as a separate image by digest.
      # We must build per-platform because each architecture needs a
      # different pre-compiled binary. The digests are collected and
      # merged into a multi-arch manifest in the next step.
      - name: Build and push per-platform images
        run: |
          VERSION="${{ needs.check.outputs.version }}"

          # Platform mapping: buildx-platform  →  Rust target triple
          declare -A PLATFORM_MAP=(
            ["amd64"]="x86_64-unknown-linux-musl"
            ["arm64"]="aarch64-unknown-linux-musl"
            ["armv7"]="armv7-unknown-linux-musleabihf"
            ["armv6"]="arm-unknown-linux-musleabihf"
            ["i386"]="i686-unknown-linux-musl"
          )

          mkdir -p /tmp/digests

          for PLAT in amd64 arm64 armv7 armv6 i386; do
            TARGET="${PLATFORM_MAP[$PLAT]}"
            BUILD_DIR="/tmp/build-${PLAT}"

            # Assemble per-platform build context
            mkdir -p "${BUILD_DIR}/assets"
            cp "artifacts/dufs-${TARGET}/dufs"  "${BUILD_DIR}/"
            cp -r "artifacts/assets-${TARGET}/"* "${BUILD_DIR}/assets/" 2>/dev/null || true
            cp Dockerfile.fix "${BUILD_DIR}/"

            # Build and push by digest (no tags — we create manifests later)
            DIGEST=$(
              docker buildx build \
                --platform "linux/${PLAT}" \
                --file "${BUILD_DIR}/Dockerfile.fix" \
                --target final \
                --label "org.opencontainers.image.title=dufs-material" \
                --label "org.opencontainers.image.description=Dufs file server with Material Design UI (fix version)" \
                --label "org.opencontainers.image.vendor=take7yo" \
                --label "org.opencontainers.image.version=${VERSION}-fix" \
                --output "type=image,name=${{ env.DOCKERHUB_REPO }},push-by-digest=true,name-canonical=true,push=true" \
                "${BUILD_DIR}" 2>&1 \
              | grep -oP 'sha256:[a-f0-9]+' | head -1
            )

            echo "${DIGEST}" > "/tmp/digests/${PLAT}"
            echo "Pushed linux/${PLAT}: ${DIGEST}"
          done

      # Assemble per-platform digests into multi-arch manifests
      - name: Create and push multi-arch manifests
        run: |
          VERSION="${{ needs.check.outputs.version }}"
          TAGS=("v${VERSION}-fix" "latest")

          # Collect digest references
          DIGEST_REFS=""
          for PLAT in amd64 arm64 armv7 armv6 i386; do
            DIGEST=$(cat "/tmp/digests/${PLAT}")
            DIGEST_REFS="${DIGEST_REFS} ${{ env.DOCKERHUB_REPO }}@${DIGEST}"
          done

          # Push manifest to each registry
          for TAG in "${TAGS[@]}"; do
            echo "Creating manifest: ${TAG}"
            docker buildx imagetools create \
              --tag "${{ env.DOCKERHUB_REPO }}:${TAG}" \
              --tag "${{ env.ACR_REPO }}:${TAG}" \
              ${DIGEST_REFS}
          done

      - name: Summary
        run: |
          echo "## Docker Image Published (Fix Version)" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "| Item | Value |" >> "$GITHUB_STEP_SUMMARY"
          echo "|------|-------|" >> "$GITHUB_STEP_SUMMARY"
          echo "| Version | \`${{ needs.check.outputs.version }}\` |" >> "$GITHUB_STEP_SUMMARY"
          echo "| Assets version | \`${{ needs.check.outputs.assets_version }}\` |" >> "$GITHUB_STEP_SUMMARY"
          echo "| Tags | \`v${{ needs.check.outputs.version }}-fix\`, \`latest\` |" >> "$GITHUB_STEP_SUMMARY"
          echo "| Platforms | linux/amd64, linux/arm64, linux/arm/v7, linux/arm/v6, linux/386 |" >> "$GITHUB_STEP_SUMMARY"
          echo "| Build method | Cross-compiled (Rust stable + cross) |" >> "$GITHUB_STEP_SUMMARY"
