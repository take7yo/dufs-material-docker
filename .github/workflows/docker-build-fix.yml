# ──────────────────────────────────────────────────────────────────────────────
#  docker-build-fix.yml – Manual build & publish Docker image (fix version)
#
#  Trigger: workflow_dispatch only (manual)
#  Platforms: amd64, arm64, armv7, armv6, i386
#  Tags: v{version}-fix, latest
# ──────────────────────────────────────────────────────────────────────────────
name: Build (Fix)

on:
  workflow_dispatch:
    inputs:
      version:
        description: "dufs version (e.g. 0.46.0)"
        required: true
        type: string
      assets_version:
        description: "Assets version (leave empty to use dufs version)"
        required: false
        type: string

permissions:
  contents: write

env:
  DOCKERHUB_REPO: take7yo/dufs
  ACR_REGISTRY: registry.cn-hangzhou.aliyuncs.com
  ACR_REPO: registry.cn-hangzhou.aliyuncs.com/take7yo/dufs

# ──────────────────────────────────────────────────────────────────────────────
jobs:
  check:
    runs-on: ubuntu-latest
    outputs:
      has_update: ${{ steps.check.outputs.has_update }}
      version: ${{ steps.check.outputs.version }}
      assets_version: ${{ steps.check.outputs.assets_version }}
    steps:
      - name: Validate inputs
        id: check
        run: |
          VERSION="${{ github.event.inputs.version }}"
          ASSETS_VERSION="${{ github.event.inputs.assets_version }}"
          VERSION="${VERSION#v}"
          ASSETS_VERSION="${ASSETS_VERSION#v}"
          if [ -z "$ASSETS_VERSION" ]; then
            ASSETS_VERSION="$VERSION"
          fi
          echo "Version       : ${VERSION}"
          echo "Assets version: ${ASSETS_VERSION}"
          echo "has_update=true" >> "$GITHUB_OUTPUT"
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "assets_version=${ASSETS_VERSION}" >> "$GITHUB_OUTPUT"

      - name: Verify assets release exists
        run: |
          ASSETS_VERSION="${{ steps.check.outputs.assets_version }}"
          URL="https://github.com/TransparentLC/dufs-material-assets/releases/download/v${ASSETS_VERSION}/dufs-material-assets-embed.zip"
          echo "Checking: ${URL}"
          HTTP_CODE=$(curl -sLo /dev/null -w "%{http_code}" "$URL")
          if [ "$HTTP_CODE" != "200" ]; then
            echo "::error::Assets not found at ${URL} (HTTP ${HTTP_CODE})"
            exit 1
          fi
          echo "Assets release v${ASSETS_VERSION} exists"

  build:
    runs-on: ubuntu-latest
    needs: check
    strategy:
      fail-fast: true
      matrix:
        include:
          - platform: linux/amd64
            tag: amd64
            rust_target: x86_64-unknown-linux-musl
            use_cross: false
          - platform: linux/arm64
            tag: arm64
            rust_target: aarch64-unknown-linux-musl
            use_cross: true
          - platform: linux/arm/v7
            tag: armv7
            rust_target: armv7-unknown-linux-musleabihf
            use_cross: true
          - platform: linux/arm/v6
            tag: armv6
            rust_target: arm-unknown-linux-musleabihf
            use_cross: true
          - platform: linux/386
            tag: i386
            rust_target: i686-unknown-linux-musl
            use_cross: true
    steps:
      - uses: actions/checkout@v4

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.rust_target }}

      - name: Install cross
        if: matrix.use_cross
        uses: taiki-e/install-action@v2
        with:
          tool: cross

      - name: Clone dufs source
        run: |
          git clone --depth 1 --branch "v${{ needs.check.outputs.version }}" \
            https://github.com/sigoden/dufs.git dufs-src

      - name: Download assets
        run: |
          curl -fsSL "https://github.com/TransparentLC/dufs-material-assets/releases/download/v${{ needs.check.outputs.assets_version }}/dufs-material-assets-embed.zip" -o assets.zip
          mkdir -p assets
          unzip -q assets.zip -d assets-tmp
          CONTENTS=$(ls assets-tmp)
          if [ "$(echo "$CONTENTS" | wc -l)" = 1 ] && [ -d "assets-tmp/$CONTENTS" ]; then
            cp -a assets-tmp/$CONTENTS/* assets/
          else
            cp -a assets-tmp/* assets/
          fi
          rm -rf assets.zip assets-tmp

      - name: Build dufs binary
        working-directory: dufs-src
        run: |
          if [ "${{ matrix.use_cross }}" = "true" ]; then
            cross build --locked --release --target=${{ matrix.rust_target }}
          else
            cargo build --locked --release --target=${{ matrix.rust_target }}
          fi
          cp target/${{ matrix.rust_target }}/release/dufs ../dufs
          chmod +x ../dufs

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: "[${{ matrix.tag }}] Build test image"
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile.fix
          target: test
          load: true
          tags: dufs-fix-test:${{ matrix.tag }}
          platforms: ${{ matrix.platform }}

      - name: "[${{ matrix.tag }}] Verify image"
        run: |
          IMAGE="dufs-fix-test:${{ matrix.tag }}"
          PLAT="${{ matrix.platform }}"
          UA="Mozilla/5.0 (X11; Linux x86_64) AppleWebKit/537.36 Chrome/120.0.0.0"
          docker run --rm --platform "$PLAT" --entrypoint sh "$IMAGE" -c "ls -lh /usr/local/bin/dufs"
          docker run -d --name dufs-verify --platform "$PLAT" -p 5000:5000 -e DUFS_ALLOW_ALL=true "$IMAGE"
          sleep 3
          BODY=$(curl -sf -A "$UA" http://localhost:5000/)
          if echo "$BODY" | grep -q "__INITIAL_DATA__"; then
            echo "Material UI detected"
          else
            echo "Material UI NOT detected"
            docker stop dufs-verify
            exit 1
          fi
          docker stop dufs-verify
          echo "All checks passed"

      - name: Save binary as artifact
        uses: actions/upload-artifact@v4
        with:
          name: dufs-${{ matrix.tag }}
          path: dufs
          retention-days: 1

  push:
    runs-on: ubuntu-latest
    needs: [check, build]
    steps:
      - uses: actions/checkout@v4

      - name: Download all platform artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts
          pattern: dufs-*

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Login to ACR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.ACR_REGISTRY }}
          username: ${{ secrets.ACR_USERNAME }}
          password: ${{ secrets.ACR_PASSWORD }}

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push per-platform images
        run: |
          VERSION="${{ needs.check.outputs.version }}"
          PLATFORMS="linux/amd64:amd64 linux/arm64:arm64 linux/arm/v7:armv7 linux/arm/v6:armv6 linux/386:i386"
          for ENTRY in $PLATFORMS; do
            PLAT=$(echo "$ENTRY" | cut -d: -f1)
            TAG=$(echo "$ENTRY" | cut -d: -f2)
            echo "=== Building and pushing $PLAT ==="
            cp "artifacts/dufs-$TAG/dufs" ./dufs
            TAG_ARGS=""
            TAG_ARGS="$TAG_ARGS --tag ${{ env.DOCKERHUB_REPO }}:v${VERSION}-fix-${TAG}"
            TAG_ARGS="$TAG_ARGS --tag ${{ env.ACR_REPO }}:v${VERSION}-fix-${TAG}"
            docker buildx build \
              --platform "$PLAT" \
              --file Dockerfile.fix \
              --target final \
              --provenance=false \
              --push \
              --label "org.opencontainers.image.title=dufs-material" \
              --label "org.opencontainers.image.description=Dufs file server with Material Design UI (fix version)" \
              --label "org.opencontainers.image.vendor=take7yo" \
              --label "org.opencontainers.image.version=${VERSION}-fix" \
              $TAG_ARGS \
              .
            echo "Pushed: $PLAT"
            rm -f ./dufs
          done

      - name: Create multi-platform manifest
        run: |
          VERSION="${{ needs.check.outputs.version }}"
          TAG_NAMES="v${VERSION}-fix latest"
          for REGISTRY in "${{ env.DOCKERHUB_REPO }}" "${{ env.ACR_REPO }}"; do
            for TAG_NAME in $TAG_NAMES; do
              FULL_TAG="${REGISTRY}:${TAG_NAME}"
              PLATFORM_IMAGES=""
              for PLAT_TAG in amd64 arm64 armv7 armv6 i386; do
                PLATFORM_IMAGES="$PLATFORM_IMAGES ${REGISTRY}:v${VERSION}-fix-${PLAT_TAG}"
              done
              echo "Creating manifest: $FULL_TAG"
              docker buildx imagetools create \
                --tag "$FULL_TAG" \
                $PLATFORM_IMAGES || echo "::warning::Could not create manifest for $FULL_TAG"
            done
          done

      - name: Summary
        run: |
          echo "## Docker Image Published (Fix Version)" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "| Item | Value |" >> "$GITHUB_STEP_SUMMARY"
          echo "|------|-------|" >> "$GITHUB_STEP_SUMMARY"
          echo "| Version | \`${{ needs.check.outputs.version }}\` |" >> "$GITHUB_STEP_SUMMARY"
          echo "| Assets version | \`${{ needs.check.outputs.assets_version }}\` |" >> "$GITHUB_STEP_SUMMARY"
          echo "| Tags | \`v${{ needs.check.outputs.version }}-fix\`, \`latest\` |" >> "$GITHUB_STEP_SUMMARY"
          echo "| Platforms | linux/amd64, linux/arm64, linux/arm/v7, linux/arm/v6, linux/386 |" >> "$GITHUB_STEP_SUMMARY"
          echo "| Build method | Cross-compiled (Rust stable + cross) |" >> "$GITHUB_STEP_SUMMARY"
