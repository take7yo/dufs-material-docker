# ──────────────────────────────────────────────────────────────────────────────
#  docker-build-embed.yml – Build & publish Docker image (embed version)
#
#  Trigger: schedule (daily 03:17 UTC), release, workflow_dispatch
#  Platforms: amd64, arm64, armv7, armv6, i386
#  Tags: v{version}-embed
#
#  Note: Dockerfile.embed's builder/test stages use debian:bookworm-slim which
#  no longer provides linux/arm/v6 (removed upstream between 2026-07-21 and
#  2026-08-16). Builder is pinned to linux/amd64 (only downloads pre-built
#  static binaries), and final stage uses scratch (supports all platforms).
#  CI test/verify skips linux/arm/v6, but it is still published via scratch.
# ──────────────────────────────────────────────────────────────────────────────
name: Build (Embed)

on:
  schedule:
    - cron: "17 3 * * *"
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      version:
        description: "dufs / material-assets version (e.g. 0.46.0)"
        required: false

permissions:
  contents: write

env:
  DOCKERHUB_REPO: take7yo/dufs
  ACR_REGISTRY: registry.cn-hangzhou.aliyuncs.com
  ACR_REPO: registry.cn-hangzhou.aliyuncs.com/take7yo/dufs

# ──────────────────────────────────────────────────────────────────────────────
jobs:
  check:
    runs-on: ubuntu-latest
    outputs:
      has_update: ${{ steps.check.outputs.has_update }}
      version: ${{ steps.check.outputs.version }}
      assets_version: ${{ steps.check.outputs.assets_version }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Check upstream
        id: check
        run: |
          if [ -n "${{ github.event.inputs.version }}" ]; then
            VERSION="${{ github.event.inputs.version }}"
            VERSION="${VERSION#v}"
            echo "has_update=true" >> "$GITHUB_OUTPUT"
            echo "version=$VERSION" >> "$GITHUB_OUTPUT"
            echo "assets_version=$VERSION" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if [ "${{ github.event_name }}" = "release" ]; then
            VERSION="${GITHUB_REF_NAME#v}"
            echo "has_update=true" >> "$GITHUB_OUTPUT"
            echo "version=$VERSION" >> "$GITHUB_OUTPUT"
            echo "assets_version=$VERSION" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          UPSTREAM_TAG=$(curl -fsSL \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/TransparentLC/dufs-material-assets/releases/latest" \
            | jq -r '.tag_name // empty')
          if [ -z "${UPSTREAM_TAG}" ]; then
            echo "::warning::Could not fetch upstream release tag"
            echo "has_update=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          UPSTREAM_VERSION="${UPSTREAM_TAG#v}"
          CURRENT_VERSION=$(cat CURRENT_VERSION 2>/dev/null || echo "0.0.0")
          if [ "${UPSTREAM_VERSION}" = "${CURRENT_VERSION}" ]; then
            echo "has_update=false" >> "$GITHUB_OUTPUT"
          else
            echo "has_update=true" >> "$GITHUB_OUTPUT"
            echo "version=$UPSTREAM_VERSION" >> "$GITHUB_OUTPUT"
            echo "assets_version=$UPSTREAM_VERSION" >> "$GITHUB_OUTPUT"
          fi

  build:
    runs-on: ubuntu-latest
    needs: check
    if: needs.check.outputs.has_update == 'true'
    strategy:
      fail-fast: true
      matrix:
        include:
          - platform: linux/amd64
            tag: amd64
          - platform: linux/arm64
            tag: arm64
          - platform: linux/arm/v7
            tag: armv7
          - platform: linux/arm/v6
            tag: armv6
          - platform: linux/386
            tag: i386
    steps:
      - uses: actions/checkout@v4

      - name: "[amd64] Save version"
        if: matrix.platform == 'linux/amd64'
        run: echo "${{ needs.check.outputs.version }}" > CURRENT_VERSION

      - name: "[amd64] Commit version"
        if: matrix.platform == 'linux/amd64'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add CURRENT_VERSION
          git diff --cached --quiet || git commit -m "chore: bump version to ${{ needs.check.outputs.version }}"
          git push || echo "::warning::Could not push"

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: "[${{ matrix.tag }}] Build test image"
        # Skip for linux/arm/v6 because debian:bookworm-slim no longer provides
        # a manifest for this platform (upstream removed it between 2026-07-21
        # and 2026-08-16). The final published image uses scratch and does not
        # depend on debian, so armv6 is still included in the multi-arch manifest.
        if: matrix.platform != 'linux/arm/v6'
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile.embed
          target: test
          load: true
          tags: dufs-embed-test:${{ matrix.tag }}
          platforms: ${{ matrix.platform }}
          build-args: |
            DUFS_VERSION=${{ needs.check.outputs.version }}

      - name: "[${{ matrix.tag }}] Verify image"
        # Skip for linux/arm/v6 for the same reason as above.
        if: matrix.platform != 'linux/arm/v6'
        run: |
          IMAGE="dufs-embed-test:${{ matrix.tag }}"
          PLAT="${{ matrix.platform }}"
          UA="Mozilla/5.0 (X11; Linux x86_64) AppleWebKit/537.36 Chrome/120.0.0.0"
          docker run --rm --platform "$PLAT" --entrypoint sh "$IMAGE" -c "ls -lh /bin/dufs"
          docker run -d --name dufs-verify --platform "$PLAT" -p 5000:5000 -e DUFS_ALLOW_ALL=true "$IMAGE"
          sleep 3
          BODY=$(curl -sf -A "$UA" http://localhost:5000/)
          if echo "$BODY" | grep -q "__INITIAL_DATA__"; then
            echo "Material UI detected"
          else
            echo "Material UI NOT detected"
            docker stop dufs-verify
            exit 1
          fi
          docker stop dufs-verify
          echo "All checks passed"

  push:
    runs-on: ubuntu-latest
    needs: [check, build]
    steps:
      - uses: actions/checkout@v4

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Login to ACR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.ACR_REGISTRY }}
          username: ${{ secrets.ACR_USERNAME }}
          password: ${{ secrets.ACR_PASSWORD }}

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: |
            ${{ env.DOCKERHUB_REPO }}
            ${{ env.ACR_REPO }}
          tags: |
            type=raw,value=v${{ needs.check.outputs.version }}-embed
          labels: |
            org.opencontainers.image.title=dufs-material
            org.opencontainers.image.description=Dufs file server with Material Design UI (embed version)
            org.opencontainers.image.vendor=take7yo
            org.opencontainers.image.version=${{ needs.check.outputs.version }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile.embed
          # linux/arm/v6 is retained here because:
          #   - builder stage is pinned to linux/amd64 (only downloads static binaries)
          #   - final stage uses scratch (supports all platforms including arm/v6)
          # CI test/verify for arm/v6 is skipped above (debian-based test stage),
          # but the published multi-arch manifest still includes arm/v6.
          platforms: linux/amd64,linux/arm64,linux/arm/v7,linux/arm/v6,linux/386
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            DUFS_VERSION=${{ needs.check.outputs.version }}

      - name: Summary
        run: |
          echo "## Docker Image Published (Embed Version)" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "| Item | Value |" >> "$GITHUB_STEP_SUMMARY"
          echo "|------|-------|" >> "$GITHUB_STEP_SUMMARY"
          echo "| Version | \`${{ needs.check.outputs.version }}\` |" >> "$GITHUB_STEP_SUMMARY"
          echo "| Tag | \`v${{ needs.check.outputs.version }}-embed\` |" >> "$GITHUB_STEP_SUMMARY"
          echo "| Platforms | linux/amd64, linux/arm64, linux/arm/v7, linux/arm/v6, linux/386 |" >> "$GITHUB_STEP_SUMMARY"
          echo "| Build method | Pre-built binary (Dockerfile.embed, scratch final) |" >> "$GITHUB_STEP_SUMMARY"
